<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordiva - Privacy Policy & Data Safety</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --space-black: #050508;
            --nebula-purple: #6b21a8;
            --star-blue: #3b82f6;
            --glass-white: rgba(255, 255, 255, 0.05);
            --text-gray: #a1a1aa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--space-black);
            color: white;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #1e1b4b 0%, #050508 100%);
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 80px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
        }

        .logo {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-gray);
            font-size: 1.1rem;
        }

        .card {
            background: var(--glass-white);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 40px;
            margin-bottom: 30px;
        }

        h2 {
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        p, li {
            color: var(--text-gray);
            margin-bottom: 15px;
        }

        ul {
            list-style: none;
            padding-left: 20px;
        }

        ul li::before {
            content: "✦";
            color: var(--star-blue);
            margin-right: 10px;
        }

        .language-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .lang-btn {
            background: var(--glass-white);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
        }

        .lang-btn.active {
            background: var(--star-blue);
        }

        footer {
            text-align: center;
            padding: 40px;
            color: #4b5563;
        }
    </style>
</head>
<body>

<div class="stars-container" id="stars"></div>

<div class="language-switcher">
    <button class="lang-btn" id="btn-tr" onclick="switchLang('tr')">TR</button>
    <button class="lang-btn" id="btn-en" onclick="switchLang('en')">EN</button>
</div>

<div class="container">
    <header>
        <div class="logo">WORDIVA</div>
        <p class="subtitle" id="last-update"></p>
    </header>

    <div id="tr-content">
        <section class="card">
            <h2>Giriş</h2>
            <p>Wordiva olarak gizliliğinize önem veriyoruz.</p>
        </section>
    </div>

    <div id="en-content">
        <section class="card">
            <h2>Introduction</h2>
            <p>At Wordiva, we value your privacy.</p>
        </section>
    </div>

    <footer>
        <p>&copy; 2026 Wordiva</p>
    </footer>
</div>

<script>
    function setLastUpdate(lang) {
        const el = document.getElementById('last-update');
        if (lang === 'tr') {
            el.textContent = "Son Güncelleme: 28 Nisan 2026";
        } else {
            el.textContent = "Last Updated: April 28, 2026";
        }
    }

    function switchLang(lang) {
        const tr = document.getElementById('tr-content');
        const en = document.getElementById('en-content');

        const btnTR = document.getElementById('btn-tr');
        const btnEN = document.getElementById('btn-en');

        if (lang === 'tr') {
            tr.style.display = 'block';
            en.style.display = 'none';
            btnTR.classList.add('active');
            btnEN.classList.remove('active');
        } else {
            tr.style.display = 'none';
            en.style.display = 'block';
            btnTR.classList.remove('active');
            btnEN.classList.add('active');
        }

        localStorage.setItem('lang', lang);
        setLastUpdate(lang);
    }

    function initLang() {
        const saved = localStorage.getItem('lang');

        if (saved) {
            switchLang(saved);
        } else {
            const browserLang = navigator.language.startsWith('tr') ? 'tr' : 'en';
            switchLang(browserLang);
        }
    }

    // stars
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 120; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        const size = Math.random() * 3;
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        s.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
        starsContainer.appendChild(s);
    }

    initLang();
</script>

</body>
</html>
