<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wordiva — Welcome to the Word Galaxy</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />

<style>
/* --- senin CSS aynen --- */
body { font-family: 'Lato', sans-serif; background:#060810; color:#fff; }
.lang-switcher{display:flex;gap:6px}
.lang-btn{cursor:pointer;padding:6px 12px;border:none;background:#222;color:#aaa}
.lang-btn.active{background:#F0C040;color:#000}
</style>
</head>

<body>

<div class="lang-switcher">
  <button class="lang-btn" data-lang="tr">TR</button>
  <button class="lang-btn" data-lang="en">EN</button>
</div>

<h1 data-i18n="hero.title">WORDIVA</h1>
<p data-i18n="hero.sub"></p>

<script>
/* TRANSLATIONS */
const T = {
  tr: {
    'hero.title':'WORDIVA',
    'hero.sub':'Kelime galaksisine hoş geldin'
  },
  en: {
    'hero.title':'WORDIVA',
    'hero.sub':'Welcome to the word galaxy'
  }
};

/* LANGUAGE SYSTEM */
function applyLang(l) {
  const t = T[l];

  document.documentElement.lang = l;
  document.title = l === 'tr'
    ? 'Wordiva — Kelime Galaksisine Hoş Geldin'
    : 'Wordiva — Welcome to the Word Galaxy';

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const val = t[el.dataset.i18n];
    if (val) el.innerHTML = val;
  });

  document.querySelectorAll('.lang-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.lang === l)
  );

  localStorage.setItem('lang', l);
}

/* INIT */
function initLang() {
  const saved = localStorage.getItem('lang');

  if (saved) {
    applyLang(saved);
  } else {
    const browserLang = navigator.language.startsWith('tr') ? 'tr' : 'en';
    applyLang(browserLang);
  }
}

/* EVENTS */
document.querySelectorAll('.lang-btn')
  .forEach(btn => btn.addEventListener('click', () => applyLang(btn.dataset.lang)));

initLang();
</script>

</body>
</html>
